services:
  api:
    build: .
    ports:
      - "8000:8080"
    environment:
      DATABASE_URL: postgresql+psycopg://rag_user:rag_password@postgres:5432/rag_db
      OLLAMA_HOST: http://ollama:11434
      SESSION_TTL_SECONDS: 1800
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      ENABLE_STUDY_ROUTES: "false"
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  ollama:
    build:
      context: .
      dockerfile: docker/ollama/Dockerfile
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=127.0.0.1:11434 ollama show nomic-embed-text >/dev/null && OLLAMA_HOST=127.0.0.1:11434 ollama show qwen3:1.7b >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 120
      start_period: 30s
    restart: unless-stopped

  front:
    build: ../cv-suporter-front
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  ollama_data:
