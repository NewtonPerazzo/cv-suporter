services:
  api:
    build: .
    ports:
      - "8000:8080"

    volumes:
      - ./app:/usr/local/app/app

    env_file:
      - .env

    command: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8080
      --reload

    depends_on:
      - postgres

  postgres:
    image: pgvector/pgvector:pg16

    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
